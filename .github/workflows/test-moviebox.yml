
name: Test MovieBox API

on:
  workflow_dispatch:
    inputs:
      title:
        description: Movie or series title to test
        required: true
        default: Avatar

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MovieBox API
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cli]"

      - name: Test movie availability
        run: |
          moviebox v3 download-movie "${{ inputs.title }}" --test --yes
