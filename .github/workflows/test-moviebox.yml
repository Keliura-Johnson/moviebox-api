name: Test MovieBox API and MP4 detection

on:
  workflow_dispatch:
    inputs:
      title:
        description: Movie or series title to test in the MovieBox CLI
        required: true
        default: Avatar
  push:
    paths:
      - "scripts/check_mp4_url.py"
      - ".github/workflows/test-moviebox.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MovieBox API
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cli]" httpx

      - name: Test MovieBox title resolution
        env:
          MOVIE_TITLE: ${{ inputs.title || 'Avatar' }}
        run: |
          moviebox v3 download-movie "$MOVIE_TITLE" --test --yes

      - name: Verify MP4 detector using a public sample clip
        run: |
          python scripts/check_mp4_url.py "https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4"

      - name: Check authorized media URL, if configured
        env:
          MEDIA_TEST_URL: ${{ secrets.MEDIA_TEST_URL }}
        run: |
          if [ -z "$MEDIA_TEST_URL" ]; then
            echo "SKIPPED: Add MEDIA_TEST_URL as a GitHub Actions secret to inspect your own/authorized media URL."
          else
            python scripts/check_mp4_url.py "$MEDIA_TEST_URL"
          fi
